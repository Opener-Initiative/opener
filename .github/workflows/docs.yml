name: docs

on:
  push:
    branches: [main]
  # Also build on PRs, so that warnings failing the build are caught before
  # merging.
  pull_request:

permissions:
  contents: read

env:
  ZEPHYR_BASE: /tmp/zephyr

jobs:
  build:
    # Specifically request a 26.04 runner as 24.04 installs Doxygen version
    # 1.9.8 from package sources (doc/CMakeLists.txt requires 1.12).
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # On PRs, cancel a running build when a new commit is pushed. On main,
    # queue builds instead.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Fetch Zephyr doc extensions
        # Only Zephyr's Sphinx extensions (doc/_extensions) are required here.
        # Use revision ncs-v3.3.1 of sdk-zephyr to match doc/requirements.txt.
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch ncs-v3.3.1 \
            https://github.com/nrfconnect/sdk-zephyr "$ZEPHYR_BASE"
          git -C "$ZEPHYR_BASE" sparse-checkout set doc/_extensions

      - name: Install dependencies
        run: pip install -r doc/requirements.txt

      - name: Build docs (see doc/build/index.rst)
        working-directory: doc
        run: |
          cmake -GNinja -S. -B_build
          cmake --build _build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc/_build/html/opener

  deploy:
    needs: build
    # Only deploy on pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploy one at a time, and let running deployments finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
